# Local multi-profile stack.
#
# One service per browser identity, each with its own persistent Chrome
# profile, its own admin UI port and its own noVNC port. This mirrors the
# k8s layout (one Deployment per profile) so a recipe behaves the same in
# both places.
#
#   docker compose up -d --build
#   open http://localhost:8901/   (profile "x")
#   open http://localhost:6081/vnc.html
#
# Never put the noVNC ports on a public interface: a logged-in browser behind
# a public port is an account takeover. On a server, bind them to the
# Tailscale address or reach them through an SSH tunnel.

x-common: &common
  build: .
  restart: unless-stopped
  shm_size: 2g
  # Chrome is a multi-process app; without an init it leaves zombies.
  init: true
  # Run as the invoking user so the bind-mounted profiles/ and data/ dirs are
  # writable without a chown. (In k8s this is what fsGroup does.)
  user: "${UID:-1000}:${GID:-1000}"

services:
  profile-x:
    <<: *common
    container_name: browser-agent-x
    environment:
      AGENT_PROFILE: x
      PROFILES_ROOT: /profiles
      DATA_ROOT: /data
      NOVNC_PORT: "6080"
      CONTROL_TOKEN: ${CONTROL_TOKEN:-devtoken}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-glm-4.5v}
      NOTIFY_ON_ESCALATION: "false"
      # Uncomment to route through the residential proxy. From a laptop you
      # would point this at an ssh -D tunnel instead of the in-cluster name.
      # HTTP_PROXY: socks5://host.docker.internal:1080
      # HTTPS_PROXY: socks5://host.docker.internal:1080
    ports:
      - "127.0.0.1:8901:8000"   # admin UI + API
      - "127.0.0.1:6081:6080"   # noVNC (takeover)
    volumes:
      - ./profiles/x:/profiles/x
      - ./data/x:/data

  # A second identity. Copy this block to add more.
  #
  # profile-linkedin:
  #   <<: *common
  #   container_name: browser-agent-linkedin
  #   environment:
