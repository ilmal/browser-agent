  #     DATA_ROOT: /data
  #     NOVNC_PORT: "6080"
  #     CONTROL_TOKEN: ${CONTROL_TOKEN:-devtoken}
  #     LLM_ENABLED: "false"
  #   ports:
  #     - "127.0.0.1:8902:8000"
  #     - "127.0.0.1:6082:6080"
