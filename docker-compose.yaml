services:
  snapchat-bot:
    build:
      context: .
      dockerfile: Dockerfile-vnc
    image: snapchat-bot-vnc
    ports:
      - "6080:6080"  # noVNC web interface
      - "5900:5900"  # VNC server (optional)
    volumes:
      - ./driver_user:/app/src/driver_user  # Mount to the path the app expects
    environment:
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
      - SCREEN_WIDTH=720
      - SCREEN_HEIGHT=1280
      - SCREEN_DEPTH=24
      - SNAPCHAT_USERNAME=your_username_here
      - SNAPCHAT_PASSWORD=your_password_here
    shm_size: 4g
    container_name: snapchat-bot-vnc
    stop_signal: SIGTERM
    stop_grace_period: 10s