# browser-agent on cn1.
#
# One Deployment per profile. Each pod is a single browser identity with its
# own persistent Chrome profile on a PVC. Pods are never scaled beyond
# replicas: 1 — two pods sharing one profile dir is the one way to corrupt a
# session, and a second browser in the same identity is not a thing a site
# would ever see from a human.
#
# Image: push to the in-cluster registry on cn1 as browser-agent:<sha>.
---
apiVersion: v1
kind: Namespace
metadata:
  name: browser-agent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: profile-x
  namespace: browser-agent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# NOTE: no Secret here. The control-plane token and the llm-service key are
# created out of band and never committed — this repo is public:
#
#   kubectl -n browser-agent create secret generic browser-agent-secrets \
#     --from-literal=CONTROL_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=LLM_API_KEY="<your-client-key>" \
#     --from-literal=OPS_ALERT_URL=""
#
# The llm-service key must be a *client* key with no entry in llm-service's
# LLM_KEY_POLICIES: a policy-scoped key can be limited to backends that do not
# serve the configured model (the "nanobrowser" key is ollama_cloud-only and
# rejects glm-4.5v). Create one with:
#
#   curl -X POST http://localhost:8001/v1/keys \
#     -H 'Content-Type: application/json' -d '{"name":"browser-agent"}'
#
# The Deployment references the Secret via envFrom below, so applying this file
# without it leaves the pod in CreateContainerConfigError rather than running
# with a guessable token and a dead LLM fallback.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-x
  namespace: browser-agent
  labels: { app: browser-agent, profile: x }
spec:
  replicas: 1
  strategy:
    # A profile is single-writer: never run two pods against one PVC.
    type: Recreate
  selector:
    matchLabels: { app: browser-agent, profile: x }
  template:
    metadata:
      labels: { app: browser-agent, profile: x }
    spec:
      # A fixed hostname, because it leaks into Chrome's profile lock.
      # user_data_dir/SingletonLock is a symlink whose target text is
      # "<hostname>-<pid>". A pod's default hostname is its own name, which
      # changes on every recreate, while the profile sits on a stable PVC. If
      # Chrome is killed rather than closed (node loss, OOM, SIGKILL) the lock
      # survives, and on the next boot Chrome sees a foreign hostname in it and
      # exits with PROFILE_IN_USE without starting. Pinning the hostname keeps
      # the lock valid across restarts; the app also clears a stale lock on
      # boot.
      hostname: browser-agent
      # Kubernetes' equivalent of tini: without it Chrome's helper processes
      # become zombies and hold the PID table open.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      # cn1 is amd64 and office-server is arm64. The image is built on an
      # amd64 machine and pushed as a single-arch manifest, so without this a
      # pod scheduled onto office-server dies with an exec-format error. Build
      # a multi-arch image before removing this.
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: agent
          image: localhost:5000/browser-agent:48a5ec8
          imagePullPolicy: IfNotPresent
          ports:
            - { name: api, containerPort: 8000 }
            - { name: novnc, containerPort: 6080 }
          env:
            - { name: AGENT_PROFILE, value: x }
            - { name: PROFILES_ROOT, value: /profiles }
            - { name: DATA_ROOT, value: /data }
            - { name: NOVNC_PORT, value: "6080" }
            # Set to the public base URL when the pod is reached through a
            # reverse proxy, so the UI links it instead of a pod port. Left
            # empty here because the real host name is deployment-specific and
            # kept local (see k8s/local/).
            - { name: BROWSER_BASE_URL, value: "" }
            - { name: SCREEN_WIDTH, value: "1440" }
            - { name: SCREEN_HEIGHT, value: "900" }
            # LLM fallback: llm-service, in-cluster. No per-call fees.
            - { name: LLM_BASE_URL, value: "http://llm-service.llm-service.svc.cluster.local:8001/v1" }
            # deepseek-v4.1-flash, not glm-4.5v. The vision GLM is zai-ONLY in
            # llm-service (no twin in Ollama Cloud's catalogue), so it has no
            # failover: when zai wedged on 2026-09-21 every escalation hung for
            # the full budget and the UI read "llm: unreachable". This id is on
            # ollama_cloud and answers in <1s, and it handles image parts.
            - { name: LLM_MODEL, value: "deepseek-v4.1-flash" }
            - { name: LLM_ENABLED, value: "true" }
            # llm-service authenticates every token-spending call and requires a
            # client id in the body. The source lands in its call log, so it is
            # named for this caller rather than the default "openai-compat".
            - { name: LLM_SOURCE, value: "browser-agent" }
            - { name: LLM_CLIENT_ID, value: "browser-agent" }
            # plan.task: the planner reuses the same endpoint, key and source
            # as the fallback, with a faster text model and its own client id
            # so llm-service's call log can tell the two callers apart.
            - { name: PLANNER_MODEL, value: "deepseek-v4.1-flash" }
            - { name: PLANNER_MAX_STEPS, value: "12" }
            - { name: PLANNER_STEP_TIMEOUT_S, value: "10" }
            - { name: PLANNER_CLIENT_ID, value: "browser-agent-planner" }
            # Laya gate. Runs over HTTP against llm-service's /v1/decide
            # proxy (see the llm-service skill) — no torch in this image.
            # PICK stays off on engine grounds: benched in this pod
            # 2026-09-21 (scripts/laya_pick_bench.py), laya could not
            # discriminate candidates — choice head 4/18 with flat
            # probabilities, yes/no tournament all p in 0.41-0.55 — so no
            # confidence floor is ever cleared. CONFIRM stays on: its
            # failure mode is a repair attempt, not a human page.
            - { name: LAYA_ENABLED, value: "true" }
            - { name: LAYA_DECIDE_URL, value: "http://llm-service.llm-service.svc.cluster.local:8001/v1/decide" }
            - { name: LAYA_PICK_ENABLED, value: "false" }
            - { name: LAYA_MIN_CONFIDENCE, value: "0.75" }
            # 10 = the calibrated choice range (buckets >=11 ship distorted
            # temperatures) and fits the 512-token budget.
            - { name: LAYA_MAX_CANDIDATES, value: "10" }
            - { name: LAYA_PICK_RETRIES, value: "1" }
            # Element picker: same numbered-lines/bind-by-index contract as
            # the laya picker, but the model is deepseek-v4.1-flash —
            # benched 18/18 at ~1 s/pick on the same fixtures
            # (scripts/llm_pick_bench.py) where laya scored 4/18. Selectorless
            # click/type steps bind by index through this; laya is asked
            # first and only answers on single-candidate pages.
            - { name: PICKER_ENABLED, value: "true" }
            - { name: PICKER_MODEL, value: "deepseek-v4.1-flash" }
            - { name: PICKER_CLIENT_ID, value: "browser-agent-picker" }
            # LLM_API_KEY comes from the Secret (envFrom below), which is the
            # name llm-service's own manifests already use for it.
            #
            # Egress through the residential proxy. A datacenter IP is the
            # fastest way to get a session flagged, so this is not optional.
            # Named BROWSER_PROXY, not HTTP_PROXY: the conventional names are
            # honoured implicitly by every HTTP client in the process, which
            # would route the in-cluster LLM call through the proxy and fail.
            # Chrome receives this explicitly at launch instead.
            - { name: BROWSER_PROXY, value: "socks5://office-proxy.crawl.svc.cluster.local:1080" }
          envFrom:
            - secretRef: { name: browser-agent-secrets }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - { name: profile, mountPath: /profiles }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: api }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: profile
          persistentVolumeClaim: { claimName: profile-x }
        # Schedules + artifacts. Small, and losing it is not a disaster, so it
        # shares the profile volume rather than getting its own claim.
        - name: data
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: profile-x
  namespace: browser-agent
  labels: { app: browser-agent, profile: x }
spec:
  type: ClusterIP
  selector: { app: browser-agent, profile: x }
  ports:
    - { name: api, port: 8000, targetPort: api }
    - { name: novnc, port: 6080, targetPort: novnc }
